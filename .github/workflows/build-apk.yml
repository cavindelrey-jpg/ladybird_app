name: Build CFPMI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prune old artifacts to free storage quota
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh api /repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[].id'); do
            echo "Deleting stale artifact $id..."
            gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts/$id || true
          done

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Cache the debug keystore so every release build uses the exact same
      # signing certificate. This enables in-place APK updates on Android devices
      # without uninstalling or signature conflict errors.
      - name: Cache debug keystore (keeps APK signing key stable across builds)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-cfpmi

      - name: Regenerate app icon + splash from CFPMI branding
        run: |
          flutter pub run flutter_launcher_icons
          flutter pub run flutter_native_splash:create

      - name: Re-apply Android 12 splash crop fix (regeneration overwrites it)
        run: |
          sed -i 's|@drawable/android12splash</item>|@drawable/android12splash_inset</item>|' \
            android/app/src/main/res/values-v31/styles.xml \
            android/app/src/main/res/values-night-v31/styles.xml

          python3 - <<'PY'
          import re
          for f in [
              "android/app/src/main/res/values-v31/styles.xml",
              "android/app/src/main/res/values-night-v31/styles.xml",
          ]:
              with open(f) as fh:
                  content = fh.read()
              content = re.sub(r"<!--.*?-->", "", content, flags=re.DOTALL)
              with open(f, "w") as fh:
                  fh.write(content)
          PY

      - name: Build AppBundle and Split APKs
        run: |
          flutter build appbundle --release --flavor cfpmi --dart-define=BRAND_ID=cfpmi
          flutter build apk --release --flavor cfpmi --dart-define=BRAND_ID=cfpmi --target-platform android-arm64

      - name: Upload AppBundle (Artifact)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cfpmi-release-aab
          path: build/app/outputs/bundle/cfpmiRelease/app-cfpmi-release.aab
          retention-days: 1

      - name: Upload Split APKs (Artifact)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cfpmi-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 1

      - name: Publish Release Assets to GitHub Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure release exists
          gh release view latest-cfpmi || gh release create latest-cfpmi \
            --title "CFPMI - Latest Release (v2.0.1+2)" \
            --notes "Automated CFPMI build release"

          # Upload and overwrite assets with retry
          for attempt in 1 2 3; do
            echo "Uploading release assets (attempt $attempt)..."
            if gh release upload latest-cfpmi \
              build/app/outputs/bundle/cfpmiRelease/app-cfpmi-release.aab \
              build/app/outputs/flutter-apk/*.apk \
              --clobber; then
              echo "Successfully uploaded release assets!"
              exit 0
            fi
            echo "Upload failed, retrying in 10s..."
            sleep 10
          done
          echo "Failed to upload release assets after 3 attempts."
          exit 1

