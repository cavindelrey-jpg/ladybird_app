name: Build Ladybird APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        # This project defines 3 Gradle product flavors (academia/greenhill/
        # ladybird) under the "brand" dimension for the shared white-label
        # codebase -- without --flavor, Gradle builds all three sequentially
        # (~20min instead of ~5) and the plain app-release.apk this workflow
        # expects never gets produced, only the per-flavor ones.
        run: flutter build apk --release --flavor ladybird

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-release-apk
          path: build/app/outputs/flutter-apk/app-ladybird-release.apk
