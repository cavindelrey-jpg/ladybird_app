name: Build Ladybird APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Regenerate app icon + splash from Ladybird branding
        # pubspec.yaml's flutter_launcher_icons/flutter_native_splash config
        # points at assets/branding/ladybird_logo.jpg, but that only takes
        # effect once these generators actually run -- only codemagic.yaml
        # ran this step; this workflow never did, so the checked-in mipmap/
        # splash files stayed whatever they were generated from last.
        run: |
          flutter pub run flutter_launcher_icons
          flutter pub run flutter_native_splash:create

      - name: Re-apply Android 12 splash crop fix (regeneration overwrites it)
        # flutter_native_splash:create above just regenerated
        # values-v31/styles.xml and values-night-v31/styles.xml pointing
        # windowSplashScreenAnimatedIcon straight at the raw, unpadded
        # @drawable/android12splash -- which Android's SplashScreen API
        # crops into (no safe-zone margin on the source logo). The fix is
        # @drawable/android12splash_inset (a committed, hand-written file
        # the generator doesn't know about and won't delete/regenerate) --
        # this step just re-points the two regenerated styles.xml files at
        # it, every build. See android/app/src/main/res/drawable/
        # android12splash_inset.xml's own header comment for the full
        # explanation.
        #
        # This runner is ubuntu-latest (GNU sed) -- codemagic.yaml's own
        # version of this step uses `sed -i ''` because IT runs on
        # mac_mini_m2 (BSD sed, which treats -i's next argument as a
        # backup-suffix). Using that same `-i ''` form here would make GNU
        # sed treat '' as the script and the first real path as the script
        # instead -- the exact bug that comment documents, just the other
        # platform's version of it. Plain `-i` (no argument) is correct here.
        run: |
          sed -i 's|@drawable/android12splash</item>|@drawable/android12splash_inset</item>|' \
            android/app/src/main/res/values-v31/styles.xml \
            android/app/src/main/res/values-night-v31/styles.xml

          # flutter_native_splash's own regenerated comment text contains a
          # bare "--" mid-comment, which the Android resource merger's
          # stricter-than-browsers XML parser rejects outright. Strip every
          # XML comment from these two regenerated files rather than
          # patching specific wording controlled by the plugin, not us.
          python3 - <<'PY'
          import re
          for f in [
              "android/app/src/main/res/values-v31/styles.xml",
              "android/app/src/main/res/values-night-v31/styles.xml",
          ]:
              with open(f) as fh:
                  content = fh.read()
              content = re.sub(r"<!--.*?-->", "", content, flags=re.DOTALL)
              with open(f, "w") as fh:
                  fh.write(content)
          PY

      - name: Build APK
        # This project defines 3 Gradle product flavors (academia/greenhill/
        # ladybird) under the "brand" dimension for the shared white-label
        # codebase -- without --flavor, Gradle builds all three sequentially
        # (~20min instead of ~5) and the plain app-release.apk this workflow
        # expects never gets produced, only the per-flavor ones.
        run: flutter build apk --release --flavor ladybird --dart-define=BRAND_ID=ladybird

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-release-apk
          path: build/app/outputs/flutter-apk/app-ladybird-release.apk
