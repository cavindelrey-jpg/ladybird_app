name: Build Ladybird Web

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web (Ladybird)
        run: |
          flutter build web --release --dart-define=BRAND_ID=ladybird
          cp web/_redirects build/web/_redirects 2>/dev/null || true

      - name: Archive Web build
        run: cd build && zip -r ladybird-web-release.zip web

      - name: Upload Web Build (Artifact)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ladybird-web-release
          path: build/web
          retention-days: 7

      - name: Publish Web Asset to GitHub Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-ladybird || gh release create latest-ladybird \
            --title "Ladybird Group of Schools - Latest Release (v2.0.1+2)" \
            --notes "Automated Ladybird build release"

          for attempt in 1 2 3; do
            echo "Uploading web release asset (attempt $attempt)..."
            if gh release upload latest-ladybird \
              build/ladybird-web-release.zip \
              --clobber; then
              echo "Successfully uploaded web release asset!"
              exit 0
            fi
            echo "Upload failed, retrying in 5s..."
            sleep 5
          done
          echo "Failed to upload release asset after 3 attempts."
          exit 1
