name: Ladybird CI (test then build)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 1. Tests run first. If they fail, the build job below never runs. ──
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run flutter test
        run: flutter test

  # ── 2. Build only after tests pass (needs: test). ──
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web (Ladybird)
        run: |
          flutter build web --release --dart-define=BRAND_ID=ladybird
          cp web/_redirects build/web/_redirects 2>/dev/null || true

      - name: Upload web build (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-web
          path: build/web
          retention-days: 7

      - name: Build Android APK (Ladybird)
        run: flutter build apk --release --flavor ladybird --dart-define=BRAND_ID=ladybird --target-platform android-arm64

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ladybird-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      # ── Android App Bundle (.aab) — the artifact uploaded to Google Play.
      # Signed with the committed upload key (android/key.properties +
      # android/app/upload-keystore.jks); applicationId com.ladybird.app.
      - name: Build Android App Bundle (AAB, Ladybird)
        run: flutter build appbundle --release --flavor ladybird --dart-define=BRAND_ID=ladybird --target-platform android-arm64

      - name: Upload AAB (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-release-aab
          path: build/app/outputs/bundle/**/*.aab
          retention-days: 14
