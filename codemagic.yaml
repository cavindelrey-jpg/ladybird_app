workflows:
  android-release:
    name: Ladybird Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Pinned, not "stable" -- "stable" floats to whatever's newest at
      # build time, and it just broke this build: a newer stable SDK
      # added TextInputClient.onFocusReceived, which the locked
      # flutter_quill 11.5.0 (pubspec.lock) doesn't implement, so every
      # test/build touching the Quill editor failed to compile. 3.41.5 is
      # the exact version this codebase has actually been developed and
      # verified against. Bump deliberately (and re-verify flutter_quill
      # compatibility) rather than letting this drift again.
      flutter: 3.41.5
      # No android_signing block yet — Codemagic validates that any
      # referenced keystore actually exists under Code signing identities
      # (Settings > Code signing identities > Android keystores), it does
      # NOT silently no-op for a missing one. Until a real release
      # keystore is uploaded there, the app keeps building signed with
      # the debug keystore (see android/app/build.gradle.kts's release
      # signingConfig) — fine for internal testing, not for Play Store.
      # Once a keystore is uploaded (name it `ladybird_release`), add:
      #   android_signing:
      #     - ladybird_release
      vars:
        BRAND_ID: ladybird
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Regenerate app icon + splash from Ladybird branding
        # pubspec.yaml's flutter_launcher_icons/flutter_native_splash
        # config points at assets/branding/ladybird_logo.jpg (the real
        # crest, copied from mockups/mockup2.jpg) -- this will run and
        # produce icons, but with black corners instead of a clean
        # transparent edge until that file is replaced with a proper
        # cutout PNG (see docs/AUTOPILOT_LOG.md and pubspec.yaml's comment
        # above the flutter_launcher_icons config).
        script: |
          flutter pub run flutter_launcher_icons
          flutter pub run flutter_native_splash:create
      - name: Re-apply Android 12 splash crop fix (regeneration overwrites it)
        # flutter_native_splash:create above just regenerated
        # values-v31/styles.xml and values-night-v31/styles.xml pointing
        # windowSplashScreenAnimatedIcon straight at the raw, unpadded
        # @drawable/android12splash -- which Android's SplashScreen API
        # crops into (no safe-zone margin on the source logo). The fix is
        # @drawable/android12splash_inset (a committed, hand-written file
        # the generator doesn't know about and won't delete/regenerate) --
        # this step just re-points the two regenerated styles.xml files at
        # it, every build, since the generator has no config knob for this.
        # See android/app/src/main/res/drawable/android12splash_inset.xml's
        # own header comment for the full explanation.
        script: |
          # -i '' (with the explicit empty-string argument), not bare -i:
          # this workflow runs on mac_mini_m2, i.e. BSD sed, which treats
          # -i's very next argument as a backup-file suffix -- without the
          # empty string there, BSD sed swallowed the s/// script as that
          # suffix and tried to parse the first file PATH as the sed
          # script instead, failing with "command a expects \ followed by
          # text" (a path fragment happened to look like a broken `a`
          # command). GNU sed (Linux) would need bare -i instead; this
          # script only ever runs on Codemagic's mac_mini_m2, so no
          # cross-platform branch is needed here.
          sed -i '' 's|@drawable/android12splash</item>|@drawable/android12splash_inset</item>|' \
            android/app/src/main/res/values-v31/styles.xml \
            android/app/src/main/res/values-night-v31/styles.xml

          # flutter_native_splash's own regenerated comment text contains a
          # bare "--" mid-comment (e.g. "...raw, unpadded @drawable/
          # android12splash -- which Android's..."), which the Android
          # resource merger's stricter-than-browsers XML parser rejects
          # outright ("The string "--" is not permitted within comments.") --
          # a real build failure, not a lint. Comments are inert at
          # runtime, so the robust fix is to strip every XML comment from
          # these two regenerated files outright rather than trying to
          # patch specific wording that's controlled by the plugin, not us,
          # and could change on any flutter_native_splash version bump.
          python3 - <<'PY'
          import re
          for f in [
              "android/app/src/main/res/values-v31/styles.xml",
              "android/app/src/main/res/values-night-v31/styles.xml",
          ]:
              with open(f) as fh:
                  content = fh.read()
              content = re.sub(r"<!--.*?-->", "", content, flags=re.DOTALL)
              with open(f, "w") as fh:
                  fh.write(content)
          PY
      - name: Analyze
        # --no-fatal-infos: flutter analyze exits 1 on ANY finding,
        # including plain style infos (unnecessary_const, prefer_const_
        # constructors, etc.) -- there's a real, pre-existing baseline of
        # those in this project that isn't worth blocking a release build
        # on. Actual errors and warnings still fail this step.
        script: flutter analyze --no-fatal-infos
      - name: Run tests
        script: flutter test
      - name: Build Ladybird APK
        # --target-platform=android-arm64: without this Flutter builds a
        # "fat" universal APK bundling native libs for every ABI (arm64,
        # armv7, x86_64), which is why the artifact ballooned to ~83MB.
        # Restricting to arm64 (what virtually every real Android device
        # sold since ~2018 is) is what produced the ~40MB build before.
        script: |
          flutter build apk --release \
            --flavor ladybird \
            --dart-define=BRAND_ID=ladybird \
            --dart-define=APP_MODE=school \
            --target-platform=android-arm64
    artifacts:
      # Only the exact Ladybird release output -- not a recursive
      # `outputs/**/*.apk` glob, which would match the SAME apk twice
      # (Gradle writes it to both outputs/flutter-apk/ and
      # outputs/apk/ladybird/release/) and would match the other flavors'
      # output too if those ever get built alongside this.
      - build/app/outputs/flutter-apk/app-ladybird-release.apk
