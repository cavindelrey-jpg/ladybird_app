workflows:
  android-release:
    name: Academia Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Pinned, not "stable" -- "stable" floats to whatever's newest at
      # build time, and it just broke this build: a newer stable SDK
      # added TextInputClient.onFocusReceived, which the locked
      # flutter_quill 11.5.0 (pubspec.lock) doesn't implement, so every
      # test/build touching the Quill editor failed to compile. 3.41.5 is
      # the exact version this codebase has actually been developed and
      # verified against. Bump deliberately (and re-verify flutter_quill
      # compatibility) rather than letting this drift again.
      flutter: 3.41.5
      # No android_signing block yet — Codemagic validates that any
      # referenced keystore actually exists under Code signing identities
      # (Settings > Code signing identities > Android keystores), it does
      # NOT silently no-op for a missing one. Until a real release
      # keystore is uploaded there, the app keeps building signed with
      # the debug keystore (see android/app/build.gradle.kts's release
      # signingConfig) — fine for internal testing, not for Play Store.
      # Once a keystore is uploaded (name it `academia_release`), add:
      #   android_signing:
      #     - academia_release
      vars:
        BRAND_ID: academia
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        # --no-fatal-infos: flutter analyze exits 1 on ANY finding,
        # including plain style infos (unnecessary_const, prefer_const_
        # constructors, etc.) -- there's a real, pre-existing baseline of
        # those in this project that isn't worth blocking a release build
        # on. Actual errors and warnings still fail this step.
        script: flutter analyze --no-fatal-infos
      - name: Run tests
        script: flutter test
      - name: Build Academia APK
        # --target-platform=android-arm64: without this Flutter builds a
        # "fat" universal APK bundling native libs for every ABI (arm64,
        # armv7, x86_64), which is why the artifact ballooned to ~83MB.
        # Restricting to arm64 (what virtually every real Android device
        # sold since ~2018 is) is what produced the ~40MB build before.
        script: |
          flutter build apk --release \
            --flavor academia \
            --dart-define=BRAND_ID=academia \
            --target-platform=android-arm64
    artifacts:
      # Only the exact Academia release output -- not the recursive
      # `outputs/**/*.apk` glob this had before, which matched the SAME
      # apk twice (Gradle writes it to both outputs/flutter-apk/ and
      # outputs/apk/academia/release/) and, before Green Hill was
      # dropped above, matched that flavor's two copies too -- 4 files
      # for what was really one built APK.
      - build/app/outputs/flutter-apk/app-academia-release.apk
