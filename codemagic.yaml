workflows:
  android-greenhill-release:
    name: Android - Green Hill (release)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.example.academia_app.greenhill"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Flutter unit tests
        script: |
          flutter test
      - name: Build Green Hill release APK
        script: |
          # Single flavor + single ABI keeps this to exactly one small APK
          # instead of Gradle emitting one-per-flavor (or one-per-ABI with
          # --split-per-abi) -- see android/app/build.gradle.kts for the
          # flavor/minify/proguard setup this build relies on.
          flutter build apk --release \
            --flavor greenhill \
            --dart-define=BRAND_ID=green_hill \
            --dart-define=APP_MODE=school \
            --target-platform android-arm64
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/**/mapping.txt

  android-academia-release:
    name: Android - Academia (release)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.example.academia_app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Flutter unit tests
        script: |
          flutter test
      - name: Build Academia release APK
        script: |
          flutter build apk --release \
            --flavor academia \
            --dart-define=BRAND_ID=academia \
            --dart-define=APP_MODE=platform \
            --target-platform android-arm64
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/**/mapping.txt
