name: academia_app
description: Academia Cameroon — School Management Platform
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Core
  provider: ^6.1.5+1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  http: ^1.2.1

  # Firebase Ecosystem (NDK 27 compatible)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  cloud_functions: ^5.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3

  # UI, Styling & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0

  # Rich Text Canvas Editor & Word Importer Dependencies
  flutter_quill: ^11.0.0
  flutter_quill_extensions: ^11.0.0
  archive: ^3.6.1
  xml: ^6.5.0

  # File Management, Pickers & Utilities
  file_picker: ^8.1.2              # CHANGED from 12.0.0-beta.7 to a highly stable production release
  image_picker: ^1.1.2
  url_launcher: ^6.0.0
  share_plus: ^9.0.0
  intl: ^0.20.2
  csv: ^8.0.0
  excel: ^4.0.6
  win32: ^5.5.0                    # Now perfectly unifies file_picker, share_plus, and flutter_quill
  google_sign_in: ^6.3.0
  video_player: ^2.11.1
  chewie: ^1.14.1
  pdfx: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.3
  # Already a transitive dep of flutter_quill (used internally for its
  # rich-paste HTML->Delta conversion) — declared directly so the
  # section-3 paste-structure test can import it without an analyzer lint.
  flutter_quill_delta_from_html: ^1.5.3

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/images/
    - assets/icon/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/academia_logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/academia_logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icon/academia_logo.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/icon/academia_logo.png"
  android: true
  ios: true

dependency_overrides:
  web: ^1.1.1
  win32: ^5.5.0
  intl: ^0.19.0
  package_info_plus: ^8.1.4