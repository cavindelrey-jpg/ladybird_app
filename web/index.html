<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CFPMI - Professional Training & Academic Excellence">
  <meta name="theme-color" content="#F5F7FA">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CFPMI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Ladybird Group of Schools</title>
  <link rel="manifest" href="manifest.json">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F5F7FA;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      background-color: #F5F7FA;
    }
    .sk-wrap { width: min(320px, 80%); }
    .sk {
      height: 14px;
      border-radius: 7px;
      margin: 10px 0;
      background: linear-gradient(90deg, #E3E8EF 25%, #F1F4F8 50%, #E3E8EF 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
    }
    .sk.lg { height: 22px; width: 60%; }
    .sk.sm { width: 45%; }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @media (prefers-color-scheme: dark) {
      html, body, .loading-container {
        background-color: #0D1117;
      }
      .sk {
        background: linear-gradient(90deg, #1C2430 25%, #263041 50%, #1C2430 75%);
        background-size: 200% 100%;
      }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="sk-wrap"><div class="sk lg"></div><div class="sk"></div><div class="sk"></div><div class="sk sm"></div></div>
  </div>
  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>
